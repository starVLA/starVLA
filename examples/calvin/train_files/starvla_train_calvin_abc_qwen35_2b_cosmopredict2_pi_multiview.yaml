run_id: qwen35_2b_cosmopredict2_pi_calvin_abc_multiview
run_root_dir: results/Checkpoints
seed: 42
wandb_entity: your_wandb_entity
wandb_project: starVLA_Calvin
is_debug: false
version_id: "0.21"

framework:
  name: QwenCosmosPI
  qwenvl:
    base_vlm: ./playground/Pretrained_models/Qwen3.5-2B
    attn_implementation: flash_attention_2
    vl_hidden_dim: 2048
    num_vl_layers: 36
  world_model:
    base_wm: ./playground/Pretrained_models/nvidia/Cosmos-Predict2-2B-Video2World
    extract_layers: [-1]
    multiview_mode: horizontal_concat
  fusion:
    num_cosmos_tokens: 64
    train_cosmos_backbone: false
  action_model:
    action_model_type: LayerwiseFM
    action_dim: 7
    state_dim: 0
    action_horizon: 8
    repeated_diffusion_steps: 2
    num_inference_timesteps: 4
    add_pos_embed: true
    max_seq_len: 1024
    num_target_vision_tokens: 32
    noise_beta_alpha: 1.5
    noise_beta_beta: 1.0
    noise_s: 0.999
    num_timestep_buckets: 1000
    diffusion_model_cfg:
      dropout: 0.2
      final_dropout: true
      interleave_self_attention: true
      norm_type: "ada_norm"
      positional_embeddings: null
      attention_head_dim: 64

datasets:
  vla_data:
    dataset_py: lerobot_datasets
    include_state: false
    data_root_dir: .
    data_mix: calvin_task_ABC_D_multiview
    action_type: delta_qpos
    per_device_batch_size: 32
    load_all_data_for_training: true
    obs_image_size: [224, 224]
    video_backend: torchvision_av

trainer:
  max_train_steps: 40000
  num_warmup_steps: 2000
  save_interval: 5000
  eval_interval: 1000
  learning_rate:
    base: 1.0e-6
    qwen_vl_interface: 1.0e-6
    cosmos_to_qwen: 1.0e-4
    action_model: 5.0e-5
  lr_scheduler_type: cosine_with_min_lr
  scheduler_specific_kwargs:
    min_lr: 1.0e-5
  freeze_modules: cosmos_backbone
  loss_scale:
    vla: 1.0
  max_grad_norm: 1.0
  weight_decay: 0.0
  logging_frequency: 10
  gradient_clipping: 1.0
  gradient_accumulation_steps: 1
  optimizer:
    name: AdamW
    betas: [0.9, 0.95]
    eps: 1.0e-08
    weight_decay: 1.0e-08
