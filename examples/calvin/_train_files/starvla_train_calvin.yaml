run_id: starvla
run_root_dir: results/Checkpoints
seed: 42
wandb_entity: your_wandb_entity
wandb_project: llavavla
is_debug: false
version_id: "0.21"

framework:
    name: CosmoPredict2GR00T
    world_model:
      base_wm: /inspire/qb-ilm2/project/26summer-camp-10/26220319/playground/Pretrained_models/nvidia/Cosmos-Predict2-2B-Video2World
      extract_layers: [-1]
    qwenvl:
      base_vlm: /inspire/qb-ilm2/project/26summer-camp-10/26220319/playground/Pretrained_models/nvidia/Cosmos-Predict2-2B-Video2World
      vl_hidden_dim: 2048
    action_model:
      action_model_type: DiT-B
      action_hidden_dim: 1024
      hidden_size: 1024
      add_pos_embed: true
      max_seq_len: 1024
      action_dim: 7
      state_dim: 7
      action_horizon: 8
      repeated_diffusion_steps: 8
      num_inference_timesteps: 4
      num_target_vision_tokens: 32
      noise_beta_alpha: 1.5
      noise_beta_beta: 1.0
      noise_s: 0.999
      num_timestep_buckets: 1000
      diffusion_model_cfg:
        cross_attention_dim: 2048
        dropout: 0.2
        final_dropout: true
        interleave_self_attention: true
        norm_type: "ada_norm"
        num_layers: 16
        output_dim: 1024
        positional_embeddings: null
    reduce_in_full_precision: true

datasets:
  vlm_data:
    dataset_py: vlm_datasets
    dataformat: llava_json
    dataset_use: sharegpt4v_coco
    eval_dataset: sharegpt4v_coco
    data_flatten: false
    base_interval: 2
    max_pixels: 307200
    min_pixels: 784
    model_max_length: 2048
    model_type: qwen2.5vl
    per_device_batch_size: 4

  vla_data:
    dataset_py: lerobot_datasets
    include_state: false
    data_root_dir: /inspire/qb-ilm2/project/26summer-camp-10/public/inspire_shared/calvin_abc_d
    data_mix: calvin_task_ABC
    action_type: delta_qpos
    CoT_prompt: "Your task is {instruction}. To identify the key objects for your task. Locate their bounding boxes in [x1,y1,x2,y2] format."
    per_device_batch_size: 16
    load_all_data_for_training: true
    video_backend: torchvision_av
    tasks_override_path: /inspire/qb-ilm2/project/26summer-camp-10/26220319/starVLA/examples/calvin/train_files/abc_tasks_d_style.jsonl 

trainer:
  max_train_steps: 30000
  num_warmup_steps: 5000
  save_interval: 5000
  eval_interval: 100
  learning_rate:
    base: 2.5e-05
    qwen_vl_interface: 1.0e-05
    action_model: 1.0e-04
  lr_scheduler_type: cosine_with_min_lr
  scheduler_specific_kwargs:
    min_lr: 1.0e-06
  freeze_modules: ''
  loss_scale:
    vla: 1.0
    vlm: 0.1
  max_grad_norm: 1.0
  weight_decay: 0.0
  logging_frequency: 10
  gradient_clipping: 1.0
  gradient_accumulation_steps: 1

  optimizer:
    name: AdamW
    betas: [0.9, 0.95]
    eps: 1.0e-08
    weight_decay: 1.0e-08


