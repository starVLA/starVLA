run_id: baseline_qwen3vl_action_moe_lora_calvin_abc_augmented
run_root_dir: results/Checkpoints
seed: 42
wandb_entity: your_wandb_entity
wandb_project: starvla_calvin_autoresearch
is_debug: false
version_id: "0.21"

framework:
  name: QwenGR00T_MoE_LoRA
  qwenvl:
    base_vlm: ./playground/Pretrained_models/Qwen3-VL-4B-Instruct-Action
    attn_implementation: flash_attention_2
    vl_hidden_dim: 2048
  qwen_lora:
    enabled: true
    rank: 8
    alpha: 16
    dropout: 0.05
    last_n_layers: 4
    target_modules: [q_proj, k_proj, v_proj, o_proj]
  vl_connector:
    enabled: false
  action_model:
    action_model_type: DiT-B
    action_hidden_dim: 1024
    hidden_size: 1024
    add_pos_embed: true
    max_seq_len: 1024
    action_dim: 7
    state_dim: 7
    action_horizon: 8
    repeated_diffusion_steps: 4
    noise_beta_alpha: 1.5
    noise_beta_beta: 1.0
    noise_s: 0.999
    num_timestep_buckets: 1000
    num_inference_timesteps: 4
    num_target_vision_tokens: 32
    moe_config:
      num_experts: 4
      expert_hidden_dim: 256
    diffusion_model_cfg:
      cross_attention_dim: 2048
      dropout: 0.2
      final_dropout: true
      interleave_self_attention: true
      norm_type: ada_norm
      num_layers: 16
      output_dim: 1024
      positional_embeddings: null

datasets:
  vlm_data:
    dataset_py: vlm_datasets
    dataformat: llava_json
    dataset_use: sharegpt4v_coco
    eval_dataset: sharegpt4v_coco
    data_flatten: false
    base_interval: 2
    max_pixels: 307200
    min_pixels: 784
    model_max_length: 2048
    model_type: qwen3vl
    per_device_batch_size: 1

  vla_data:
    dataset_py: lerobot_datasets
    include_state: false
    data_root_dir: playground/Datasets/calvin_lerobot
    data_mix: calvin_abc_augmented
    lerobot_version: v2.0
    action_type: delta_qpos
    sequential_step_sampling: false
    CoT_prompt: "Your task is {instruction}. To identify the key objects for your task. Locate their bounding boxes in [x1,y1,x2,y2] format."
    per_device_batch_size: 1
    load_all_data_for_training: true
    obs_image_size: [224, 224]
    video_backend: torchvision_av
    sampler:
      type: task_balanced
      report_top_k: 30
      oversample_tasks:
        turn_off_lightbulb: 5.0
        close_drawer: 4.0
        move_slider_left: 3.0
        turn_off_led: 3.0
        push_red_block_right: 3.0
        push_blue_block_right: 2.0
        push_pink_block_right: 2.0
        open_drawer: 2.0
        turn_on_lightbulb: 5.0
        stack_block: 4.0
        move_slider_right: 3.0
        push_red_block_left: 2.0
        push_blue_block_left: 2.0
        push_pink_block_left: 2.0
    language_augmentation:
      enabled: true
      apply_to: hard_tasks
      probability: 0.3
      paraphrases:
        turn_off_lightbulb: [switch off the light bulb, turn the light off, deactivate the yellow lamp]
        turn_on_lightbulb: [switch on the light bulb, turn the light on, activate the yellow lamp]
        turn_off_led: [turn off the led, switch off the green led, deactivate the led light]
        turn_on_led: [turn on the led, switch on the green led, activate the led light]
        close_drawer: [close the drawer, push the drawer shut, shut the drawer]
        open_drawer: [open the drawer, pull the drawer open]
        move_slider_left: [slide the door to the left, move the sliding door left]
        move_slider_right: [slide the door to the right, move the sliding door right]
        push_red_block_right: [push the red block to the right, move the red block right]
        push_blue_block_right: [push the blue block to the right, move the blue block right]
        push_pink_block_right: [push the pink block to the right, move the pink block right]
        push_red_block_left: [push the red block to the left, move the red block left]
        push_blue_block_left: [push the blue block to the left, move the blue block left]
        push_pink_block_left: [push the pink block to the left, move the pink block left]
    image_augmentation:
      enabled: true
      apply_to: hard_tasks
      probability: 0.35
      brightness: 0.06
      contrast: 0.06
      saturation: 0.05
      hue: 0.01
      max_translate_ratio: 0.03
      scale_range: [0.97, 1.00]
      photometric: true
      crop_translate: true
      protect_small_affordances: true
      camera_profiles:
        video.primary_image:
          photometric: true
          crop_translate: true
        video.wrist_image:
          photometric: true
          crop_translate: false
      task_profiles:
        close_drawer: {max_translate_ratio: 0.02, scale_range: [0.98, 1.00]}
        open_drawer: {max_translate_ratio: 0.02, scale_range: [0.98, 1.00]}
        move_slider_left: {max_translate_ratio: 0.02, scale_range: [0.98, 1.00]}
        move_slider_right: {max_translate_ratio: 0.02, scale_range: [0.98, 1.00]}

trainer:
  max_train_steps: 5000
  num_warmup_steps: 0
  save_interval: 500
  eval_interval: 1000000
  learning_rate:
    base: 2.5e-05
    qwen_vl_interface: 5.0e-06
    action_model: 5.0e-05
  lr_scheduler_type: cosine_with_min_lr
  scheduler_specific_kwargs:
    min_lr: 1.0e-06
  freeze_modules: qwen_vl_interface
  loss_scale:
    vla: 1.0
    vlm: 0.0
  max_grad_norm: 1.0
  weight_decay: 0.0
  logging_frequency: 10
  gradient_clipping: 1.0
  gradient_accumulation_steps: 1
  save_format: pt
  optimizer:
    name: AdamW
    betas: [0.9, 0.95]
    eps: 1.0e-08
    weight_decay: 1.0e-08
