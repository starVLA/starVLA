run_id: qwen_var_productvq_g16_s1248_weighted_stage1_e99_nextscale_65k_gbs64_jike8h100
run_root_dir: /root/feihong/starVLA/Checkpoints
seed: 42
wandb_entity: smap
wandb_project: starVLA_Libero
is_debug: false
version_id: "0.24"

framework:
  name: QwenVARScaleParallel
  qwenvl:
    base_vlm: ./playground/Pretrained_models/Qwen3-VL-4B-Instruct-VARAction
    attn_implementation: flash_attention_2
  stage1_tokenizer:
    artifact: playground/Checkpoints/var_stage1_pi05_libero_q99_e32_productvq_weighted_tasks/best_recon.ckpt
    stage1_config: examples/simBenchmarks/LIBERO/train_files/train_var_stage1_pi05_libero_q99_e32_productvq_weighted_tasks_resume_e50_to_e100.yaml
    freeze: true
    token_cache: playground/Checkpoints/var_stage1_pi05_libero_q99_e32_productvq_weighted_tasks/stage2_token_cache_full_epoch099.pt
  action_token_text:
    prefix: "<var_action_"
    suffix: ">"
  parallel_head:
    num_cross_attention_layers: 2
    num_attention_heads: 8
    mlp_ratio: 4.0
    dropout: 0.0
    code_condition_dropout: 0.0
    label_smoothing: 0.02
    classifier: per_factor

  proprio_state:
    enabled: true
    state_dim: 8
    add_context_token: true
    add_to_pooled: true

datasets:
  vla_data:
    dataset_py: var_stage2_token_dataset
    data_mix: libero_all_q99
    include_state: true
    per_device_batch_size: 8
    num_workers: 4
    shuffle: true
    mode: train
    window_mode: full
    skip_bad_samples: true
    max_read_retries: 16

trainer:
  pretrained_checkpoint: null
  # Safe on the first launch (starts from scratch) and on subsequent launches
  # (loads the numerically latest checkpoint from this run directory).
  is_resume: true
  max_train_steps: 65000
  num_warmup_steps: 5000
  save_interval: 1000
  eval_interval: 2000
  # Keep every 1k checkpoint in the requested 40k--65k rollout window.
  checkpoint_retention_policy: latest_and_range
  checkpoint_keep_best: 0
  checkpoint_keep_latest: 1
  checkpoint_archive_start_step: 40000
  checkpoint_archive_end_step: 65000
  checkpoint_archive_interval: 1000
  checkpoint_metric: mse_score
  checkpoint_metric_mode: min
  learning_rate:
    base: 2.0e-05
    qwen_vl_interface: 1.0e-05
  lr_scheduler_type: cosine_with_min_lr
  scheduler_specific_kwargs:
    min_lr: 1.0e-06
  freeze_modules: null
  loss_scale:
    vla: 1.0
  max_grad_norm: 1.0
  weight_decay: 0.0
  logging_frequency: 50
  metric_ema_beta: 0.98
  gradient_clipping: 1.0
  # 8 GPUs x 8 samples/GPU x 1 accumulation = effective global batch size 64.
  gradient_accumulation_steps: 1
  gradient_checkpointing: true
  optimizer:
    name: AdamW
    betas: [0.9, 0.95]
    eps: 1.0e-08
    weight_decay: 1.0e-08
