run_id: qwen_var_stage3_pi_flow_g16_s1248_structemb_nextscale_100k_fullcache
run_root_dir: playground/Checkpoints
seed: 42
wandb_entity: smap
wandb_project: starVLA_Libero
is_debug: false
version_id: "0.25-stage3-s1248"

framework:
  name: QwenVARScaleParallelPiFlowStage3
  qwenvl:
    base_vlm: ./playground/Pretrained_models/Qwen3-VL-4B-Instruct-VARAction
    attn_implementation: flash_attention_2
  stage1_tokenizer:
    artifact: playground/Checkpoints/var_stage1_pi05_libero_q99_e32_aeinit_productvq_g16_s1_2_4_8_structemb/best_recon.ckpt
    stage1_config: examples/simBenchmarks/LIBERO/train_files/train_var_stage1_pi05_libero_q99_e32_aeinit_productvq_g16_s1_2_4_8_structemb.yaml
    freeze: true
    token_cache: playground/Checkpoints/var_stage1_pi05_libero_q99_e32_aeinit_productvq_g16_s1_2_4_8_structemb/stage2_token_cache_full.pt
  action_token_text:
    prefix: "<var_action_"
    suffix: ">"
  parallel_head:
    num_cross_attention_layers: 2
    num_attention_heads: 8
    mlp_ratio: 4.0
    dropout: 0.0
    label_smoothing: 0.02
    classifier: per_factor
    code_condition_dropout: 0.0
  stage3:
    var_ce_weight: 1.0
    flow_loss_weight: 1.0
  action_model:
    action_model_type: LayerwiseFM
    add_pos_embed: true
    max_seq_len: 1024
    action_dim: 7
    state_dim: 7
    action_horizon: 8
    repeated_diffusion_steps: 2
    noise_beta_alpha: 1.5
    noise_beta_beta: 1.0
    noise_s: 0.999
    num_timestep_buckets: 1000
    num_inference_timesteps: 4
    num_target_vision_tokens: 32
    diffusion_model_cfg:
      action_dit_hidden_dim: 1024
      dropout: 0.2
      final_dropout: true
      interleave_self_attention: true
      norm_type: ada_norm
      attention_head_dim: 64
      positional_embeddings: null

datasets:
  vla_data:
    dataset_py: var_stage2_token_dataset
    data_mix: libero_all_q99
    per_device_batch_size: 1
    num_workers: 4
    shuffle: true
    mode: train
    window_mode: full
    skip_bad_samples: true
    max_read_retries: 16

trainer:
  # Set by launch command to the Stage2 100k checkpoint. Missing Flow-head
  # weights are intentionally left randomly initialized, matching pi0.5-style
  # post-training.
  pretrained_checkpoint: null
  is_resume: true
  max_train_steps: 100000
  num_warmup_steps: 3000
  save_interval: 1000
  eval_interval: 1000
  checkpoint_retention_policy: latest_and_best
  checkpoint_keep_latest: 1
  checkpoint_keep_best: 2
  checkpoint_metric: mse_score
  checkpoint_metric_mode: min
  learning_rate:
    base: 2.5e-05
    qwen_vl_interface: 1.0e-05
    action_model: 1.0e-04
  lr_scheduler_type: cosine_with_min_lr
  scheduler_specific_kwargs:
    min_lr: 1.0e-06
  freeze_modules: null
  loss_scale:
    vla: 1.0
  max_grad_norm: 1.0
  weight_decay: 0.0
  logging_frequency: 50
  metric_ema_beta: 0.98
  gradient_clipping: 1.0
  gradient_accumulation_steps: 1
  gradient_checkpointing: true
  optimizer:
    name: AdamW
    betas: [0.9, 0.95]
    eps: 1.0e-08
    weight_decay: 1.0e-08
