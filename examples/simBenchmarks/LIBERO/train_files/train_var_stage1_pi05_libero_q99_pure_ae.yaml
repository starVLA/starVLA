experiment:
  name: var_stage1_pi05_libero_q99_pure_ae
  output_dir: playground/Checkpoints/var_stage1_pi05_libero_q99_pure_ae
  seed: 42

data:
  starvla_config_yaml: examples/simBenchmarks/LIBERO/train_files/starvla_cotrain_libero.yaml
  data_root_dir: playground/Datasets/LEROBOT_LIBERO_DATA
  data_mix: libero_all_q99
  video_backend: torchvision_av
  expected_action_horizon: 8
  expected_action_dim: 7
  window_mode: full
  balance_dataset_weights: false
  balance_trajectory_weights: false

model:
  type: var_action_tokenizer
  seq_len: auto
  action_dim: auto
  embed_dim: 128
  codebook_size: 512
  scales: auto
  use_dilated: true
  commitment_cost: 0.25
  normalize_codebook_for_lookup: true
  decoder_head_type: plain
  quantization_mode: none

loss:
  recon_weight: 1.0
  vel_weight: 0.5
  jerk_weight: 0.0
  vq_weight: 0.0
  vq_warmup_epochs: 0
  gripper_recon_weight: 1.0
  gripper_vel_weight: 0.1

train:
  epochs: 60
  batch_size: 256
  num_workers: 8
  learning_rate: 1.0e-4
  weight_decay: 1.0e-5
  grad_clip: 1.0
  shuffle: true
  max_batches_per_epoch: 0
  min_codebook_usage_ratio_for_balanced: 0.0
  save_every_epochs: 10
  device: cuda
