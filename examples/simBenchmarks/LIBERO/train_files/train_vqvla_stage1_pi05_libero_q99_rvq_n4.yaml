experiment:
  name: vqvla_paper_libero_q99_h8_rvq_n4_cb256
  output_dir: playground/Checkpoints/vqvla_paper_libero_q99_h8_rvq_n4_cb256
  seed: 42

data:
  starvla_config_yaml: examples/simBenchmarks/LIBERO/train_files/starvla_cotrain_libero.yaml
  data_root_dir: playground/Datasets/LEROBOT_LIBERO_DATA
  data_mix: libero_all_q99
  video_backend: torchvision_av
  expected_action_horizon: 8
  expected_action_dim: 7
  window_mode: full
  balance_dataset_weights: false
  balance_trajectory_weights: false

model:
  type: vqvla_rvq_action_tokenizer
  seq_len: auto
  action_dim: auto
  embed_dim: 32
  codebook_size: 256
  residual_vq_layers: 4
  commitment_cost: 1.0
  codebook_loss_weight: 4.0
  normalize_codebook_for_lookup: false
  use_dilated: true
  use_time_embedding: true
  use_action_type_embedding: true
  input_embedding_scale: 1.0

loss:
  recon_weight: 1.0
  vel_weight: 0.0
  jerk_weight: 0.0
  vq_weight: 1.0
  vq_warmup_epochs: 0
  gripper_recon_weight: 1.0
  gripper_vel_weight: 0.1

train:
  epochs: 50
  batch_size: 1024
  num_workers: 8
  learning_rate: 5.0e-5
  weight_decay: 1.0e-5
  grad_clip: 1.0
  shuffle: true
  max_batches_per_epoch: 0
  min_codebook_usage_ratio_for_balanced: 0.35
  save_every_epochs: 10
  device: cuda
