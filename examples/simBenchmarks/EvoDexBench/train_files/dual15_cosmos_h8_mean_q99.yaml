# Reproduction recipe for the external EvoCosmosGR00T model extension.
# EvoCosmosGR00T is not the official CosmoPredict2GR00T framework; see README.
run_id: evodex_dual_cosmos_h8_mean_15task_300k
run_root_dir: playground/Checkpoints/evodex_cosmos
seed: 42
wandb_entity: null
wandb_project: null
is_debug: false
version_id: '0.21'
framework:
  name: EvoCosmosGR00T
  world_model:
    base_wm: Cosmos-Predict2-2B-Video2World-config-f50c09f5
    extract_layers: [-1]
  qwenvl:
    base_vlm: Cosmos-Predict2-2B-Video2World-config-f50c09f5
    vl_hidden_dim: 2048
  action_model:
    action_model_type: DiT-B
    action_dim: 60
    state_dim: 62
    action_horizon: 8
    future_action_window_size: 7
    past_action_window_size: 0
    action_hidden_dim: 1024
    hidden_size: 1024
    add_pos_embed: true
    max_seq_len: 1024
    repeated_diffusion_steps: 8
    num_inference_timesteps: 4
    num_target_vision_tokens: 32
    num_timestep_buckets: 1000
    noise_beta_alpha: 1.5
    noise_beta_beta: 1.0
    noise_s: 0.999
    diffusion_model_cfg:
      cross_attention_dim: 2048
      dropout: 0.2
      final_dropout: true
      interleave_self_attention: true
      norm_type: ada_norm
      num_layers: 16
      output_dim: 1024
      positional_embeddings: null
  evodex_cosmos:
    base_config_dir: /absolute/path/Cosmos_base_config
    base_config_alias: /absolute/path/Cosmos-Predict2-2B-Video2World-config-f50c09f5
    official_checkpoint: /absolute/path/CosmoPredict2GR00T-LIBERO-50k-c62f04bf/checkpoints/steps_50000_pytorch_model.pt
    view_height: 224
    view_width: 384
    latent_mode: mean
    head_init_seed: 42
datasets:
  vla_data:
    dataset_py: lerobot_datasets
    include_state: true
    state_action_dtype: float32
    data_root_dir: playground/Datasets/EvoDexBench/dual
    data_mix: evodex_dual15_h8_q99
    lerobot_version: v3.0
    action_type: physical_semantic
    action_mode: abs
    per_device_batch_size: 4
    load_all_data_for_training: true
    obs_image_size: [224, 224]
    video_backend: torchvision_av
    num_workers: 8
    prefetch_factor: 2
trainer:
  max_train_steps: 300000
  num_warmup_steps: 5000
  save_interval: 25000
  eval_interval: 25000
  learning_rate:
    base: 0.0001
    action_model: 0.0001
  lr_scheduler_type: cosine_with_min_lr
  scheduler_specific_kwargs:
    min_lr: 5.0e-07
  freeze_modules: backbone
  loss_scale:
    vla: 1.0
  max_grad_norm: 1.0
  weight_decay: 0.0
  logging_frequency: 100
  gradient_clipping: 1.0
  gradient_accumulation_steps: 1
  gradient_checkpointing: false
  optimizer:
    name: AdamW
    betas: [0.9, 0.95]
    eps: 1.0e-08
    weight_decay: 1.0e-08
  pretrained_checkpoint: null
  is_resume: false
