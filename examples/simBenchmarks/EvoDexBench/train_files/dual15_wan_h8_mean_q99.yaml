# Reproduction recipe for the external EvoWanOFT model extension.
# EvoWanOFT is not the official WanOFT framework; see README.
run_id: evodex_dual_wan_h8_mean_15task_300k
run_root_dir: playground/Checkpoints/evodex_wan
seed: 42
wandb_entity: null
wandb_project: null
is_debug: false
version_id: '0.21'
framework:
  name: EvoWanOFT
  world_model:
    base_wm: Wan2.2-TI2V-config
    extract_layers:
    - -1
  action_model:
    action_model_type: MLP
    action_dim: 60
    state_dim: 62
    action_horizon: 8
    future_action_window_size: 7
    past_action_window_size: 0
    action_hidden_dim: 3072
  evodex_wan:
    base_config_dir: /absolute/path/Wan_base_config-b8fff731
    official_checkpoint: /absolute/path/WanOFT-LIBERO-60k-4bdf523c/checkpoints/steps_60000_pytorch_model.pt
    view_height: 384
    view_width: 672
    latent_mode: mean
    head_init_seed: 42
datasets:
  vla_data:
    dataset_py: lerobot_datasets
    include_state: true
    state_action_dtype: float32
    data_root_dir: playground/Datasets/EvoDexBench/dual
    data_mix: evodex_dual15_h8_q99
    lerobot_version: v3.0
    action_type: physical_semantic
    action_mode: abs
    per_device_batch_size: 4
    load_all_data_for_training: true
    obs_image_size:
    - 224
    - 224
    video_backend: torchvision_av
    num_workers: 8
    prefetch_factor: 2
trainer:
  max_train_steps: 300000
  num_warmup_steps: 5000
  save_interval: 25000
  eval_interval: 25000
  learning_rate:
    base: 0.0001
    action_model: 0.0001
    action_query_proj: 0.0001
  lr_scheduler_type: cosine_with_min_lr
  scheduler_specific_kwargs:
    min_lr: 5.0e-07
  freeze_modules: backbone
  loss_scale:
    vla: 1.0
  max_grad_norm: 1.0
  weight_decay: 0.0
  logging_frequency: 100
  gradient_clipping: 1.0
  gradient_accumulation_steps: 1
  gradient_checkpointing: false
  optimizer:
    name: AdamW
    betas:
    - 0.9
    - 0.95
    eps: 1.0e-08
    weight_decay: 1.0e-08
  pretrained_checkpoint: null
  is_resume: false
