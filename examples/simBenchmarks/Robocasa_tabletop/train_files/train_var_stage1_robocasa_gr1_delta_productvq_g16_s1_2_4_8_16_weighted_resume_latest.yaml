experiment:
  name: var_stage1_robocasa_gr1_delta_productvq_g16_s124816_e128_weighted
  output_dir: /root/feihong/starVLA/Checkpoints/var_stage1_robocasa_gr1_delta_productvq_g16_s124816_e128_weighted
  seed: 42
data:
  starvla_config_yaml: examples/simBenchmarks/Robocasa_tabletop/train_files/starvla_cotrain_robocasa_gr1.yaml
  data_root_dir: /root/tianyi/LDA-1B/playground/Datasets/nvidia/PhysicalAI-Robotics-GR00T-X-Embodiment-Sim
  data_mix: fourier_gr1_unified_1000
  video_backend: torchvision_av
  expected_action_horizon: 16
  expected_action_dim: 29
  action_mode: delta
  window_mode: full
  balance_dataset_weights: false
  balance_trajectory_weights: false
  load_all_data_for_training: true
  delete_pause_frame: false
model:
  type: var_action_tokenizer
  seq_len: auto
  action_dim: auto
  embed_dim: 128
  codebook_size: 512
  scales:
  - 1
  - 2
  - 4
  - 8
  - 16
  use_dilated: true
  quant_resi: 0.0
  commitment_cost: 0.25
  normalize_codebook_for_lookup: false
  decoder_head_type: plain
  quantization_mode: product_vq
  product_codebook_groups: 16
  use_time_embedding: true
  use_action_type_embedding: false
  input_embedding_scale: 1.0
loss:
  recon_weight: 1.0
  vel_weight: 0.5
  jerk_weight: 0.0
  vq_weight: 0.08
  vq_warmup_epochs: 10
  sample_weighting:
    enabled: true
    close_task_weight: 3.0
    late_phase_weight: 2.0
    close_late_weight: 1.0
    late_phase_start_ratio: 0.5
    max_weight: 6.0
    normalization: none
  time_weighting:
    enabled: true
    late_timestep_start: 8
    late_timestep_weight: 1.5
train:
  epochs: 50
  batch_size: 512
  num_workers: 8
  learning_rate: 5.0e-05
  weight_decay: 1.0e-05
  grad_clip: 1.0
  shuffle: false
  max_batches_per_epoch: 0
  min_codebook_usage_ratio_for_balanced: 0.35
  save_every_epochs: 1
  init_checkpoint: /root/feihong/starVLA/Checkpoints/var_stage1_robocasa_gr1_delta_pure_ae_e128_weighted/best_recon.ckpt
  init_checkpoint_mode: encoder_decoder
  init_codebook_from_data_batches: 64
  init_codebook_noise_scale: 0.0001
  freeze_encoder_decoder_epochs: 3
  device: cuda
  resume_checkpoint: /root/feihong/starVLA/Checkpoints/var_stage1_robocasa_gr1_delta_productvq_g16_s124816_e128_weighted/latest.ckpt
