run_id: rlbench_joint_velocity_9task_qwen3oft
run_root_dir: playground/Checkpoints
seed: 42
wandb_entity: ""
wandb_project: starVLA_RLBench
is_debug: false
version_id: "0.21"

framework:
  name: QwenOFT
  qwenvl:
    base_vlm: ./playground/Pretrained_models/Qwen3-VL-2B-Instruct
    attn_implementation: eager
    vl_hidden_dim: 2048
  action_model:
    action_model_type: MLP
    action_dim: 8
    state_dim: 53
    action_horizon: 8
    future_action_window_size: 8
    past_action_window_size: 0

datasets:
  vla_data:
    dataset_py: lerobot_datasets
    include_state: true
    data_root_dir: playground/Datasets/RLBench_lerobot
    data_mix: rlbench_joint_velocity_9task
    action_type: native_joint_velocity
    action_mode: abs
    sequential_step_sampling: false
    per_device_batch_size: 1
    load_all_data_for_training: true
    video_backend: pyav
    obs_image_size: [224, 224]

trainer:
  max_train_steps: 10000
  num_warmup_steps: 100
  save_interval: 1000
  eval_interval: 1000
  logging_frequency: 10
  learning_rate:
    base: 1.0e-05
    qwen_vl_interface: 1.0e-05
    action_model: 1.0e-04
  lr_scheduler_type: cosine_with_min_lr
  scheduler_specific_kwargs:
    min_lr: 1.0e-06
  freeze_modules: ""
  loss_scale:
    vla: 1.0
    vlm: 0.1
  max_grad_norm: 1.0
  weight_decay: 0.0
  gradient_clipping: 1.0
  gradient_accumulation_steps: 4
  optimizer:
    name: AdamW
    betas: [0.9, 0.95]
    eps: 1.0e-08
    weight_decay: 1.0e-08
  save_format: pt
