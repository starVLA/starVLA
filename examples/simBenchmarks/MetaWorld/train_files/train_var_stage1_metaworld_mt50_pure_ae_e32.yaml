experiment:
  name: var_stage1_metaworld_mt50_pure_ae_e32
  output_dir: playground/Checkpoints/var_stage1_metaworld_mt50_pure_ae_e32
  seed: 42

data:
  starvla_config_yaml: examples/simBenchmarks/MetaWorld/train_files/starvla_qwenpiv3_metaworld_mt50.yaml
  data_root_dir: playground/Datasets/metaworld_starvla
  data_mix: metaworld_mt50
  video_backend: torchvision_av
  expected_action_horizon: 8
  expected_action_dim: 4
  window_mode: full
  balance_dataset_weights: false
  balance_trajectory_weights: false

model:
  type: var_action_tokenizer
  seq_len: auto
  action_dim: auto
  embed_dim: 32
  codebook_size: 512
  scales: [1, 2, 4, 8]
  use_dilated: true
  commitment_cost: 0.25
  normalize_codebook_for_lookup: true
  decoder_head_type: plain
  quantization_mode: none
  use_time_embedding: true
  use_action_type_embedding: true
  input_embedding_scale: 1.0

loss:
  recon_weight: 1.0
  vel_weight: 0.5
  jerk_weight: 0.0
  vq_weight: 0.0
  vq_warmup_epochs: 0
  gripper_recon_weight: 1.0
  gripper_vel_weight: 0.1

train:
  epochs: 30
  batch_size: 256
  num_workers: 8
  learning_rate: 1.0e-4
  weight_decay: 1.0e-5
  grad_clip: 1.0
  shuffle: true
  max_batches_per_epoch: 0
  min_codebook_usage_ratio_for_balanced: 0.0
  save_every_epochs: 10
  device: cuda
