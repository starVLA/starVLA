experiment:
  name: var_stage1_metaworld_mt50_e32_aeinit_productvq_g16_s1_2_4_8
  output_dir: playground/Checkpoints/var_stage1_metaworld_mt50_e32_aeinit_productvq_g16_s1_2_4_8
  seed: 42

data:
  starvla_config_yaml: examples/simBenchmarks/MetaWorld/train_files/starvla_qwenpiv3_metaworld_mt50.yaml
  data_root_dir: playground/Datasets/metaworld_starvla
  data_mix: metaworld_mt50
  video_backend: torchvision_av
  expected_action_horizon: 8
  expected_action_dim: 4
  window_mode: full
  balance_dataset_weights: false
  balance_trajectory_weights: false

model:
  type: var_action_tokenizer
  seq_len: auto
  action_dim: auto
  embed_dim: 32
  codebook_size: 512
  scales: [1, 2, 4, 8]
  use_dilated: true
  quant_resi: 0.0
  commitment_cost: 0.25
  normalize_codebook_for_lookup: false
  decoder_head_type: plain
  quantization_mode: product_vq
  product_codebook_groups: 16
  use_time_embedding: true
  use_action_type_embedding: true
  input_embedding_scale: 1.0

loss:
  recon_weight: 1.0
  vel_weight: 0.5
  jerk_weight: 0.0
  vq_weight: 0.08
  vq_warmup_epochs: 10
  gripper_recon_weight: 1.0
  gripper_vel_weight: 0.1

train:
  epochs: 50
  batch_size: 256
  num_workers: 8
  learning_rate: 5.0e-5
  weight_decay: 1.0e-5
  grad_clip: 1.0
  shuffle: true
  max_batches_per_epoch: 0
  min_codebook_usage_ratio_for_balanced: 0.35
  save_every_epochs: 10
  init_checkpoint: playground/Checkpoints/var_stage1_metaworld_mt50_pure_ae_e32/best_recon.ckpt
  init_checkpoint_mode: encoder_decoder
  init_codebook_from_data_batches: 64
  init_codebook_noise_scale: 1.0e-4
  freeze_encoder_decoder_epochs: 3
  device: cuda
