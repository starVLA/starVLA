server:
  url: ws://localhost:8000

docker:
  image: ghcr.io/allenai/vla-evaluation-harness/libero:0.7.0

output_dir: results/vla_eval/libero_smoke

benchmarks:
  - benchmark: vla_eval.benchmarks.libero.benchmark:LIBEROBenchmark
    episodes_per_task: 1
    max_tasks: 1
    params:
      suite: libero_spatial
      seed: 7
      num_steps_wait: 10
