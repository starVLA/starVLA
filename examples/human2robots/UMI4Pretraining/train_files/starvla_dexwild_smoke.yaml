run_id: starvla_latest_umi_dexwild_smoke
run_root_dir: /project/vonneumann1/UMI_data/training_ready/starvla_latest_runs
seed: 42
trackers: [jsonl]
wandb_entity: disabled
wandb_project: umi-vla
is_debug: false

framework:
  name: QwenOFT
  qwenvl:
    base_vlm: /project/vonneumann1/UMI_data/models/Qwen3-VL-4B-Instruct-Action
    attn_implementation: flash_attention_2
    vl_hidden_dim: 2560
  action_model:
    action_model_type: mlp_l1_regression
    action_hidden_dim: 2560
    action_dim: 23
    state_dim: 23
    future_action_window_size: 7
    action_horizon: 8
    past_action_window_size: 0

datasets:
  vla_data:
    dataset_py: lerobot_datasets
    lerobot_version: v2.0
    data_root_dir: /project/vonneumann1/UMI_data/training_ready/starvla_data
    data_mix: umi_dexwild_400
    action_type: abs_joint_pos
    include_state: true
    sequential_step_sampling: false
    default_image_resolution: [3, 224, 224]
    image_size: [224, 224]
    obs_image_size: [224, 224]
    per_device_batch_size: 1
    load_all_data_for_training: true
    video_backend: torchvision_av
    task_id: all
    percentile_mixing_method: weighted_average
    delete_pause_frame: false

trainer:
  epochs: 1
  max_train_steps: 20
  num_warmup_steps: 1
  save_interval: 20
  eval_interval: 1000
  learning_rate:
    base: 0.0001
    qwen_vl_interface: 0.0
    action_model: 0.0001
  lr_scheduler_type: cosine_with_min_lr
  scheduler_specific_kwargs: {min_lr: 1.0e-06}
  freeze_modules: qwen_vl_interface
  loss_scale: {vla: 1.0, vlm: 0.0}
  max_grad_norm: 1.0
  warmup_ratio: 0.1
  weight_decay: 0.0
  logging_frequency: 1
  gradient_clipping: 1.0
  gradient_accumulation_steps: 1
  optimizer:
    name: AdamW
    betas: [0.9, 0.95]
    eps: 1.0e-08
    weight_decay: 1.0e-08
  is_resume: false
  resume_epoch: null
  resume_step: null
  enable_gradient_checkpointing: false
  enable_mixed_precision_training: true
